apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx # Debe coincidir con el nombre en la base
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: nginx # Debe coincidir con el contenedor en la base
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
